<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veci App | Panel de Administrador (Mapeo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { background-color: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-800">Panel de Control Veci App</h1>
            <p class="text-gray-600 mt-1">Datos recolectados del Mapeo de Necesidades (Q1)</p>
        </header>

        <div class="card mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Estado de Conexión</h2>
            <p id="auth-status" class="text-sm text-yellow-600">Inicializando... Por favor, espera.</p>
        </div>

        <div class="card">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex justify-between items-center">
                Registros de Mapeo
                <span id="data-count" class="px-3 py-1 bg-indigo-100 text-indigo-800 text-sm font-semibold rounded-full">0 Registros</span>
            </h2>
            <div id="data-list" class="space-y-4">
                <p class="text-gray-500" id="loading-message">Cargando datos. Asegúrate de haber llenado el formulario Q1.</p>
            </div>
            <p id="error-message" class="hidden mt-4 text-red-600 font-medium"></p>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Habilita el log de depuración (útil para Canvas)
        setLogLevel('Debug');

        // Variables Globales (Proporcionadas por el entorno de Canvas)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        let db;
        let auth;
        let userId = null;

        const authStatus = document.getElementById('auth-status');
        const dataList = document.getElementById('data-list');
        const dataCount = document.getElementById('data-count');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');

        try {
            // 1. Inicializar Firebase
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            authStatus.textContent = 'Firebase inicializado.';

            // 2. Proceso de Autenticación
            async function authenticate() {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                        authStatus.textContent = 'Autenticado con token personalizado.';
                    } else {
                        await signInAnonymously(auth);
                        authStatus.textContent = 'Autenticado anónimamente.';
                    }
                } catch (error) {
                    console.error("Error durante la autenticación:", error);
                    authStatus.textContent = `Error de Autenticación: ${error.message}`;
                }
            }

            // 3. Listener de Estado de Autenticación
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    authStatus.textContent = `Conectado como Administrador. UID: ${userId}`;
                    fetchMapData(userId);
                } else {
                    userId = null;
                    authStatus.textContent = 'Esperando Autenticación...';
                    authenticate(); // Intentar autenticar si no hay usuario
                }
            });

            // 4. Función para obtener datos de Mapeo
            function fetchMapData(currentUserId) {
                if (!db || !currentUserId) {
                    return; // No se puede consultar sin DB o ID de usuario
                }
                
                // Ruta donde se guardaron los datos del formulario Q1 (mapa_necesidades.html)
                // Usamos la ruta privada /artifacts/{appId}/users/{userId}/map_data
                const mapCollectionPath = `artifacts/${appId}/users/${currentUserId}/map_data`;
                const q = query(collection(db, mapCollectionPath));

                // Escuchar cambios en tiempo real (onSnapshot)
                onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });

                    loadingMessage.classList.add('hidden'); // Ocultar mensaje de carga
                    dataList.innerHTML = ''; // Limpiar lista
                    dataCount.textContent = `${data.length} Registros`;

                    if (data.length === 0) {
                        dataList.innerHTML = '<p class="text-gray-500">No hay registros de Mapeo todavía. ¡Llena el Q1 para verlos!</p>';
                        return;
                    }

                    // Renderizar los datos
                    data.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'card border-l-4 border-indigo-500 hover:shadow-lg transition duration-150';
                        
                        // Formatear las fechas si existen
                        const timestamp = item.timestamp ? (item.timestamp.toDate ? item.timestamp.toDate().toLocaleString() : new Date(item.timestamp).toLocaleString()) : 'N/A';

                        div.innerHTML = `
                            <p class="text-sm text-gray-500 mb-2">Registro #${index + 1} (${timestamp})</p>
                            <p class="font-bold text-lg text-indigo-700">Necesidad: <span class="font-normal text-gray-800">${item.need || 'N/A'}</span></p>
                            <p class="font-bold text-lg text-teal-700">Solución: <span class="font-normal text-gray-800">${item.solution || 'N/A'}</span></p>
                            <p class="text-md text-gray-700 mt-2">Barrio/Zona: <span class="font-medium">${item.location || 'N/A'}</span></p>
                            <p class="text-xs text-gray-500 mt-1">Registro ID: ${item.id}</p>
                        `;
                        dataList.appendChild(div);
                    });

                }, (error) => {
                    console.error("Error al obtener datos de Firestore:", error);
                    errorMessage.classList.remove('hidden');
                    errorMessage.textContent = `Error de Base de Datos: ${error.message}. Asegúrate de que los permisos estén correctos.`;
                });
            }

        } catch (error) {
            console.error("Error FATAL al iniciar la aplicación:", error);
            authStatus.textContent = `Error FATAL: ${error.message}`;
            errorMessage.classList.remove('hidden');
            errorMessage.textContent = 'No se pudo iniciar Firebase. Revisa la configuración.';
        }

    </script>
</body>
</html>
