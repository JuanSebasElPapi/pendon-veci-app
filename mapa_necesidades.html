<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veci: Tu Aporte Transforma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl border-t-4 border-indigo-600 space-y-6">
        <header class="text-center">
            <h1 class="text-3xl font-extrabold text-indigo-800">Mapea tu Barrio con Ciudad Emergente</h1>
            <p class="text-gray-500 mt-2">Dinos qué falta, y Veci App te traerá la solución.</p>
        </header>

        <p class="text-gray-700 text-lg">Tu opinión nos ayuda a diseñar una plataforma centrada en los problemas reales de tu cuadra.</p>
        
        <!-- Contenedor para el QR de prueba (No es el QR Final para Imprimir) -->
        <div id="qrcode1" class="flex justify-center my-4"></div>

        <form id="mapeoForm" class="space-y-4">
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="barrio" class="block text-sm font-medium text-gray-700">Barrio donde vives (Ej. La Alameda)</label>
                <input type="text" id="barrio" name="barrio" required class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="necesidad" class="block text-sm font-medium text-gray-700">¿Cuál es el principal problema de tu cuadra? (Ej. Iluminación, seguridad, parque, comercios locales)</label>
                <textarea id="necesidad" name="necesidad" rows="3" required class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-150 transform hover:scale-[1.01]">
                Enviar mi Aporte y Unirme a Veci
            </button>
        </form>

        <div id="mensaje1" class="hidden text-center p-3 rounded-lg bg-green-100 text-green-700 font-semibold">
            ¡Gracias por tu aporte! Tu voz ya está construyendo el futuro de Usaquén.
        </div>
    </div>

    <script>
        // ESTE QR ES SOLO PARA PRUEBA INTERNA Y APUNTA A ESTA MISMA PÁGINA.
        // Reemplaza "URL_REAL_Q1" con la URL de hosting de este archivo (Paso 2) para generar el QR de imprenta.
        const placeholderUrl = "URL_REAL_Q1"; 
        new QRCode(document.getElementById("qrcode1"), {
            text: placeholderUrl,
            width: 128,
            height: 128,
            colorDark: "#4338CA",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById('mapeoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log("DATOS RECOPILADOS - MAPEO:", {
                nombre: document.getElementById('nombre').value,
                barrio: document.getElementById('barrio').value,
                necesidad: document.getElementById('necesidad').value,
                timestamp: new Date().toISOString()
            });
            document.getElementById('mapeoForm').style.display = 'none';
            document.getElementById('mensaje1').classList.remove('hidden');
        });
    </script>
</body>
</html>
